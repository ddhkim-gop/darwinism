name: Auto-refresh transactions

on:
  schedule:
    # Deliberately off the :00/:30 boundary. GitHub queues scheduled runs at low
    # priority and drops them under load, and every '*/30' repo on the platform
    # contends for the same two minutes each hour — observed firing interval was
    # 1.9-4.7h against a nominal 30m. An odd offset competes with far fewer jobs.
    - cron: '13,43 * * * *'
  workflow_dispatch:           # allow manual trigger from GitHub UI

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Sleeper players data
        uses: actions/cache@v4
        with:
          path: scripts/players_cache.json
          key: sleeper-players-${{ hashFiles('scripts/players_cache.json') }}
          restore-keys: |
            sleeper-players-

      - name: Refresh transactions and rosters
        id: refresh
        run: python3 scripts/refresh_transactions.py
        continue-on-error: true   # exit code 1 = no changes (not an error)

      - name: Commit and push if data changed
        id: commit
        if: steps.refresh.outcome == 'success' && steps.refresh.conclusion == 'success'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js *.html *.js data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Auto-refresh: update transactions and rosters"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # Deploy in-run: a push made with GITHUB_TOKEN can't trigger deploy.yml, so
  # without this the refreshed data waited for the next push from the Mac.
  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # ref: main, not the triggering SHA - that predates the refresh job's push.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - uses: actions/deploy-pages@v4
        id: deployment
